# Wildlife Safari Trip Management System - Configuration
spring.application.name=safari-trip-management
server.port=8080

# Database Configuration (MySQL / XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/safari_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Cache (disabled during dev for instant refresh)
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# File Upload Settings
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
safari.upload.dir=uploads

# Spring DevTools Settings
spring.devtools.restart.enabled=false


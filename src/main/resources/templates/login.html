<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Wildlife Safari Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom-safari.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="safari-card p-4 p-md-5 shadow-sm">
                <div class="text-center mb-4">
                    <span style="font-size: 2.2rem;">🌿</span>
                    <h3 class="fw-bold mt-2 mb-1">Welcome Back</h3>
                    <p class="text-muted small">Sign in to access your role-based safari dashboard</p>
                </div>

                <div th:if="${infoMessage}" class="alert alert-warning py-2 small d-flex align-items-center gap-2 mb-3">
                    <i class="bi bi-shield-lock-fill fs-5"></i>
                    <span th:text="${infoMessage}">Please sign in to proceed with your booking.</span>
                </div>

                <form th:action="@{/login}" method="post" id="loginForm">
                    <input type="hidden" name="redirect" th:value="${redirectUrl}">

                    <div class="mb-3">
                        <label for="loginEmail" class="form-label small fw-bold">Email Address <i class="bi bi-info-circle text-muted ms-1" title="e.g. admin@safari.lk or name@gmail.com"></i></label>
                        <input type="email" class="form-control safari-input" id="loginEmail" name="email"
 required>
                        <div id="loginEmail-error" class="small text-danger validation-msg mt-1"></div>
                    </div>

                    <div class="mb-4">
                        <label for="loginPassword" class="form-label small fw-bold">Password <i class="bi bi-info-circle text-muted ms-1" title="Enter your password"></i></label>
                        <input type="password" class="form-control safari-input" id="loginPassword" name="password"
 required>
                    </div>

                    <button type="submit" class="btn btn-safari-primary w-100 py-2 mb-3">Sign In</button>

                    <div class="text-center small text-muted">
                        Don't have an account? <a th:href="@{/register(redirect=${redirectUrl})}" class="fw-bold" style="color: var(--safari-olive-dark);">Register here</a>
                    </div>
                </form>

                <!-- Quick Viva Demo Auto-Fill Helpers -->
                <div class="mt-4 pt-3 border-top">
                    <div class="small fw-bold text-muted mb-2 text-center">🎓 Fast Demo Auto-Fill (Click to Test):</div>
                    <div class="d-flex flex-wrap gap-1 justify-content-center">
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="fillCreds('admin@safari.lk', 'admin123')">Admin</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="fillCreds('operator@safari.lk', 'operator123')">Operator</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="fillCreds('ops@safari.lk', 'ops123')">Dispatcher</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="fillCreds('ranger@safari.lk', 'ranger123')">Ranger</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="fillCreds('logistics@safari.lk', 'logistics123')">Logistics</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="fillCreds('finance@safari.lk', 'finance123')">Finance</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="fillCreds('kavinda.perera@gmail.com', 'pass123')">Tourist</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/validation.js}"></script>
<script>
    function fillCreds(email, pass) {
        document.getElementById('loginEmail').value = email;
        document.getElementById('loginPassword').value = pass;
    }
</script>
</body>
</html>

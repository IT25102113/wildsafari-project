<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configure Safari Package — WildSafari Operator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom-safari.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="safari-card p-4 p-md-5 shadow-sm">
                <div class="d-flex align-items-center justify-content-between mb-4 pb-2 border-bottom">
                    <div>
                        <span class="badge badge-safari-olive mb-1">Module 1 &bull; Gallage S.P (IT25101916)</span>
                        <h3 class="fw-bold mb-0" th:text="${safariPackage.id != null} ? 'Update Safari Package' : 'Create New Safari Package'">Create Package</h3>
                    </div>
                    <a th:href="@{/packages/manage}" class="btn btn-outline-secondary btn-sm">&larr; Back to List</a>
                </div>

                <form th:action="@{/packages/save}" th:object="${safariPackage}" method="post" enctype="multipart/form-data">
                    <input type="hidden" th:field="*{id}">
                    <input type="hidden" th:field="*{coverImage}">

                    <div class="row g-3 mb-3">
                        <div class="col-md-7">
                            <label class="form-label small fw-bold">Package Name <i class="bi bi-info-circle text-muted ms-1" title="e.g. Yala Big 4 Predator Expedition"></i></label>
                            <input type="text" th:field="*{name}" class="form-control safari-input"
 required>
                            <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="small text-danger mt-1"></div>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label small fw-bold">National Park</label>
                            <select th:field="*{nationalPark}" class="form-select safari-input" required>
                                <option value="Yala National Park">Yala National Park</option>
                                <option value="Wilpattu National Park">Wilpattu National Park</option>
                                <option value="Udawalawe National Park">Udawalawe National Park</option>
                                <option value="Minneriya National Park">Minneriya National Park</option>
                                <option value="Bundala National Park">Bundala National Park</option>
                                <option value="Wasgamuwa National Park">Wasgamuwa National Park</option>
                                <option value="Horton Plains National Park">Horton Plains National Park</option>
                                <option value="Kumana National Park">Kumana National Park</option>
                                <option value="Gal Oya National Park">Gal Oya National Park</option>
                                <option value="Lunugamvehera National Park">Lunugamvehera National Park</option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Base Price per Trip (LKR) <i class="bi bi-info-circle text-muted ms-1" title="28500.00"></i></label>
                            <input type="number" step="0.01" th:field="*{basePrice}" class="form-control safari-input"
 required>
                            <div th:if="${#fields.hasErrors('basePrice')}" th:errors="*{basePrice}" class="small text-danger mt-1"></div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Peak Season Multiplier <i class="bi bi-info-circle text-muted ms-1" title="1.25"></i></label>
                            <input type="number" step="0.05" th:field="*{peakSeasonMultiplier}" class="form-control safari-input"
 required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Max Passenger Capacity <i class="bi bi-info-circle text-muted ms-1" title="6"></i></label>
                            <input type="number" th:field="*{maxGroupSize}" class="form-control safari-input"
 min="1" max="12" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Duration (Days)</label>
                            <input type="number" th:field="*{durationDays}" class="form-control safari-input" min="1" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Difficulty Level</label>
                            <select th:field="*{difficultyLevel}" class="form-select safari-input" required>
                                <option value="EASY">EASY</option>
                                <option value="MODERATE">MODERATE</option>
                                <option value="CHALLENGING">CHALLENGING</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Status</label>
                            <select th:field="*{status}" class="form-select safari-input" required>
                                <option value="ACTIVE">ACTIVE</option>
                                <option value="DRAFT">DRAFT</option>
                                <option value="INACTIVE">INACTIVE</option>
                                <option value="DISCONTINUED">DISCONTINUED</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Package Description <i class="bi bi-info-circle text-muted ms-1" title="Detailed description of wildlife tracking and safari highlights..."></i></label>
                        <textarea th:field="*{description}" class="form-control safari-input" rows="3"
 required></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Detailed Itinerary Steps <i class="bi bi-info-circle text-muted ms-1" title="05:30 AM: Palatupana Park Gate Entry&#10;06:30 AM: Coastal dunes leopard tracking&#10;..."></i></label>
                        <textarea th:field="*{itinerary}" class="form-control safari-input" rows="4"
 required></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold">Cover Photo Upload (Optional / Automatically Stored in uploads/)</label>
                        <input type="file" name="imageFile" class="form-control safari-input" accept="image/*">
                        <div th:if="${safariPackage.coverImage != null}" class="mt-2">
                            <span class="small text-muted">Current cover: </span>
                            <img th:src="${safariPackage.coverImage}" style="height: 50px; border-radius: 6px;" alt="Current">
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/packages/manage}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-safari-primary px-4">Save Safari Package</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tourist Registration — Wildlife Safari Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom-safari.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="safari-card p-4 p-md-5 shadow-sm">
                <div class="text-center mb-4">
                    <span style="font-size: 2.2rem;">🐘</span>
                    <h3 class="fw-bold mt-2 mb-1">Create Tourist Account</h3>
                    <p class="text-muted small">Register to book and manage your wildlife safari expeditions</p>
                </div>

                <form th:action="@{/register}" th:object="${user}" method="post" id="registerForm">
                    <input type="hidden" name="redirect" th:value="${redirectUrl}">
                    <input type="hidden" th:field="*{role}">

                    <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger py-2 small mb-3">
                        <div class="fw-bold mb-1"><i class="bi bi-exclamation-circle-fill me-1"></i>Please correct the following:</div>
                        <ul class="mb-0 ps-3">
                            <li th:each="err : ${#fields.allErrors()}" th:text="${err}">Error</li>
                        </ul>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Full Name <i class="bi bi-info-circle text-muted ms-1" title="e.g. Kavinda Perera"></i></label>
                        <input type="text" th:field="*{fullName}" class="form-control safari-input"
 required>
                        <div th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="small text-danger mt-1"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Email Address <i class="bi bi-info-circle text-muted ms-1" title="e.g. yourname@gmail.com"></i></label>
                        <input type="email" th:field="*{email}" class="form-control safari-input" id="regEmail"
 required>
                        <div id="regEmail-error" class="small text-danger validation-msg mt-1"></div>
                        <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="small text-danger mt-1"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Contact Number (10 Digits) <i class="bi bi-info-circle text-muted ms-1" title="e.g. 0771234567"></i></label>
                        <input type="tel" th:field="*{phone}" class="form-control safari-input" id="regPhone"
 maxlength="10" required>
                        <div id="regPhone-error" class="small text-danger validation-msg mt-1"></div>
                        <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="small text-danger mt-1"></div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold">Password <i class="bi bi-info-circle text-muted ms-1" title="Create a strong password"></i></label>
                        <input type="password" th:field="*{password}" class="form-control safari-input"
 required>
                        <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="small text-danger mt-1"></div>
                    </div>

                    <button type="submit" class="btn btn-safari-primary w-100 py-2 mb-3">Complete Registration</button>

                    <div class="text-center small text-muted">
                        Already have an account? <a th:href="@{/login(redirect=${redirectUrl})}" class="fw-bold" style="color: var(--safari-olive-dark);">Sign in</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/validation.js}"></script>
</body>
</html>
